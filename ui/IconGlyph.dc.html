<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
</style>
</helmet>

<svg ref="{{ svgRef }}" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="display: block; flex: none; width: {{ px }}; height: {{ px }}; color: {{ color }};">
  <path data-icon-d="{{ d }}" d="M0 0" stroke="currentColor" style="stroke-width: {{ sw }}; stroke-linecap: round; stroke-linejoin: round;"></path>
</svg>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:48,&quot;height&quot;:48},&quot;d&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;M3 8h10M8 3v10&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:16,&quot;min&quot;:10,&quot;max&quot;:64,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;stroke&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1.4,&quot;min&quot;:0.8,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;currentColor&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
/* 图标的 path 数据来自数据源，而洞不能写在 d 上 —— 浏览器在解析 HTML 那一刻
   就校验 d，那时洞还没被替换，控制台立刻报 Expected moveto。
   所以全项目的图标都走这一份：洞挂在 data-icon-d 上，渲染后抄进 d。
   §2.3 选的是「抽子组件」这条路 —— 这条规则只需要在这个文件里遵守一次。 */
class Component extends DCLogic {
  componentDidMount() {
    this.svgRef = React.createRef();
    this.forceUpdate();
    setTimeout(() => this.syncIcons(), 0);
  }

  componentDidUpdate() { this.syncIcons(); }

  syncIcons() {
    const root = this.svgRef && this.svgRef.current;
    if (!root) return;
    const list = root.querySelectorAll("path[data-icon-d]");
    for (let i = 0; i < list.length; i++) {
      /* 占位必须是合法的 moveto。空串同样会报 Expected moveto。 */
      const el = list[i], want = el.getAttribute("data-icon-d") || "M0 0";
      if (el.getAttribute("d") !== want) el.setAttribute("d", want);
    }
  }

  renderVals() {
    const size = Number(this.props.size) || 16;
    return {
      svgRef: this.svgRef,
      d: this.props.d || "M0 0",
      px: size + "px",
      sw: (Number(this.props.stroke) || 1.4) + "px",
      color: this.props.color || "currentColor"
    };
  }
}

</script>
</body>
</html>
