<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S9-会话面板</title>
<!-- umbradesign:resources -->
<script>window.__resources = {
    "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "./react.production.min.js",
    "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "./react-dom.production.min.js"
  };</script>
<!-- /umbradesign:resources -->
<script src="./support.js"></script>
</head>
<body>

<x-dc>
<helmet>
<link rel="stylesheet" href="./_ds-tool/tokens.css">
<style>
@font-face { font-family: 'DC'; src: local('SF Pro Display'), local('PingFang SC'), local('Microsoft YaHei'), local('Segoe UI'), local('Roboto'); }
html, body { margin: 0; padding: 0; }
body { background: var(--tool-bg); font-family: 'DC', sans-serif; font-size: 13px; line-height: 1.5; color: var(--tool-text); }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</helmet>

<!-- 壳宽度（设计侧 §2.3）：默认 380px，可拖 320–520。这里单独打开时锁在上限 520px
     并靠左 —— 它是预览壳旁边的侧栏，不是一页，按整屏宽度评审会得出错结论。 -->
<div data-tool-theme="{{ theme }}" style="min-height: 100vh; width: 100%; max-width: 520px; border-right: 1px solid var(--tool-border); background: var(--tool-panel); display: flex; flex-direction: column;">

  <!-- ═══ 顶栏 ═══ -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--tool-border); background: var(--tool-panel);">
    <button onClick="{{ goBack }}" style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: none; background: transparent; border-radius: 6px; cursor: pointer; color: var(--tool-text);" style-hover="background: var(--tool-hover);" title="返回预览">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>
    </button>
    <div style="flex: 1 1 0; min-width: 0;">
      <div style="font-size: 14px; font-weight: 560;">AI 会话</div>
      <div style="font-size: 11px; color: var(--tool-muted);">{{ sessionInfo }}</div>
    </div>
    <!-- 中断钮不在顶栏（设计侧 §2.3）：它已经换到下面的「发送」位上 ——
         一个控件位、两种状态。跑着的时候手就在输入框旁边，不该让人往回跑到顶栏去停。 -->
    <!-- 通道选择 -->
    <div style="display: flex; border: 1px solid var(--tool-border); border-radius: 6px; overflow: hidden;">
      <button onClick="{{ onChannelA }}" style="padding: 4px 10px; font-size: 11px; border: none; cursor: pointer; background: {{ chanABg }}; color: {{ chanAFg }}; font-weight: {{ chanAFw }};" style-hover="opacity: .85;">通道 A</button>
      <button onClick="{{ onChannelB }}" style="padding: 4px 10px; font-size: 11px; border: none; cursor: pointer; background: {{ chanBBg }}; color: {{ chanBFg }}; font-weight: {{ chanBFw }};" style-hover="opacity: .85;">通道 B</button>
    </div>
  </div>

  <!-- ═══ 演示态切换条（只在 ui/ 下直接打开时出现；被工具部署进项目后整行不出现） ═══ -->
  <sc-if value="{{ showDemoBar }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--tool-border); background: var(--tool-panel-2); flex-wrap: wrap; font-size: 12px;">
    <span style="font-size: 11px; color: var(--tool-muted); flex: none;">演示态</span>
    <sc-for list="{{ demoStates }}" as="st" hint-placeholder-count="6">
      <button type="button" onClick="{{ st.pick }}" title="{{ st.name }}" aria-pressed="{{ st.active }}" style="display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 9px 0 6px; border-radius: var(--tool-radius-sm); border: 1px solid; cursor: pointer; font-size: 11px; white-space: nowrap; transition: background .13s ease, border-color .13s ease, color .13s ease; background: {{ st.bg }}; border-color: {{ st.bd }}; color: {{ st.fg }};" style-focus="outline: 2px solid var(--tool-ring); outline-offset: 1px;">
        <span style="font-family: var(--tool-mono); opacity: 0.6;">{{ st.n }}</span>
        <span style="font-weight: {{ st.fw }};">{{ st.short }}</span>
      </button>
    </sc-for>
    <span style="color: var(--tool-border-strong); flex: none;">·</span>
    <span style="color: var(--tool-muted); min-width: 0;">{{ demoNote }}</span>
  </div>
  </sc-if>

  <!-- ═══ 消息区 ═══ -->
  <div style="flex: 1 1 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;">

    <sc-for list="{{ messages }}" as="m">

      <!-- 用户消息 -->
      <sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; justify-content: flex-end;">
          <div style="max-width: 80%; padding: 10px 14px; border-radius: 12px 12px 4px 12px; background: var(--tool-accent); color: white; font-size: 13px; line-height: 1.6;">
            {{ m.content }}
          </div>
        </div>
      </sc-if>

      <!-- AI 消息（设计侧 §2.3）。头像换成一根贯通整个回合的左栏：
           工具调用是上面那句话的证据，得看得出它们属于同一个回合。
           原来只有一颗 24px 圆头像，工具卡看起来像直接长在页面上。 -->
      <sc-if value="{{ m.isAi }}" hint-placeholder-val="{{ true }}">
        <div style="display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px;">
          <div style="display: flex; flex-direction: column; align-items: center;">
            <span style="width: 7px; height: 7px; flex: none; margin-top: 5px; border-radius: 999px; background: var(--tool-accent);"></span>
            <span style="flex: 1; width: 2px; margin-top: 4px; border-radius: 1px; background: var(--tool-accent-soft);"></span>
          </div>
          <div style="min-width: 0;">
            <div style="font-size: 13px; line-height: 1.6; color: var(--tool-text); white-space: pre-wrap;">{{ m.content }}</div>
            <!-- 工具调用：一条一行。名字 + 参数 + 结果摘要同行，
                 连续调六个工具时不会把对话流撑成一屏卡片。 -->
            <sc-if value="{{ m.hasTools }}" hint-placeholder-val="{{ true }}">
              <div style="margin-top: 7px; display: grid; gap: 3px;">
                <sc-for list="{{ m.tools }}" as="t" hint-placeholder-count="2">
                  <div title="{{ t.tip }}" style="display: flex; align-items: center; gap: 7px; min-width: 0; height: 24px; padding: 0 9px; border: 1px solid {{ t.bd }}; border-radius: var(--tool-radius-sm); background: {{ t.bg }}; font-size: 11px;">
                    <sc-if value="{{ t.running }}" hint-placeholder-val="{{ true }}">
                      <svg width="11" height="11" viewBox="0 0 12 12" style="flex: none; animation: spin 1s linear infinite;" aria-hidden="true">
                        <circle cx="6" cy="6" r="4.6" fill="none" stroke="var(--tool-accent)" stroke-width="1.5" stroke-dasharray="20 12"></circle>
                      </svg>
                    </sc-if>
                    <sc-if value="{{ t.done }}" hint-placeholder-val="{{ true }}">
                      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="var(--tool-ok)" stroke-width="1.6" style="flex: none;" aria-hidden="true"><path d="M2 6l3 3 5-5"></path></svg>
                    </sc-if>
                    <span style="flex: none; font-weight: 560; font-family: var(--tool-mono);">{{ t.name }}</span>
                    <span style="color: var(--tool-muted); font-family: var(--tool-mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ t.args }}</span>
                    <span style="flex: 1;"></span>
                    <span style="flex: none; font-family: var(--tool-mono); color: {{ t.resultFg }}; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ t.resultLabel }}</span>
                  </div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </div>
      </sc-if>

      <!-- 系统消息 -->
      <sc-if value="{{ m.isSystem }}" hint-placeholder-val="{{ true }}">
        <div style="text-align: center; font-size: 11px; color: var(--tool-muted); padding: 4px 0;">
          {{ m.content }}
        </div>
      </sc-if>

    </sc-for>

    <!-- 流式输出中（设计侧 §2.3）：同一根左栏，顶部的点换成转圈。
         不用闪烁的打字机光标 —— 闪烁的东西在会话流里一直在抢注意力；
         正在写的那一段底下给一条 2px 的 accent 横线，安静且同样看得见。 -->
    <sc-if value="{{ streaming }}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px;">
        <div style="display: flex; flex-direction: column; align-items: center;">
          <svg width="12" height="12" viewBox="0 0 12 12" style="flex: none; margin-top: 3px; animation: spin 1s linear infinite;" aria-hidden="true">
            <circle cx="6" cy="6" r="4.6" fill="none" stroke="var(--tool-accent)" stroke-width="1.5" stroke-dasharray="20 12"></circle>
          </svg>
          <span style="flex: 1; width: 2px; margin-top: 4px; border-radius: 1px; background: var(--tool-accent-soft);"></span>
        </div>
        <div style="min-width: 0;">
          <div style="font-size: 13px; line-height: 1.6; color: var(--tool-text); white-space: pre-wrap; padding-bottom: 5px; border-bottom: 2px solid var(--tool-accent);">{{ streamContent }}</div>
        </div>
      </div>
    </sc-if>

  </div>

  <!-- ═══ 输入区 ═══ -->
  <div style="padding: 12px 16px; border-top: 1px solid var(--tool-border); background: var(--tool-panel);">
    <!-- 「已选中」药丸（第四轮）：从「节点」泛化为五种 node / range / region / files / dir。
         一次可带多个，紧挨输入框上方（S11 定的位置）；完整 detail 挂 title，每颗带 ×。 -->
    <sc-if value="{{ hasSelections }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;">
        <sc-for list="{{ selections }}" as="p" hint-placeholder-count="2">
          <span title="{{ p.detail }}" style="display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 22px; padding: 0 4px 0 7px; border-radius: var(--tool-radius-sm); border: 1px solid var(--tool-accent-border); background: var(--tool-accent-soft); color: var(--tool-accent); font-size: 11px;">
            <dc-import name="IconGlyph" d="{{ p.icon }}" size="12" hint-size="12px,12px"></dc-import>
            <span style="flex: none; font-family: var(--tool-mono); font-weight: 600;">{{ p.kind }}</span>
            <span style="min-width: 0; font-family: var(--tool-mono); color: var(--tool-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ p.label }}</span>
            <button type="button" onClick="{{ p.remove }}" title="不带这一项" style="flex: none; width: 16px; height: 16px; display: grid; place-items: center; border: 0; background: transparent; color: var(--tool-muted); border-radius: 3px; cursor: pointer;" style-hover="background: var(--tool-panel); color: var(--tool-text);" style-focus="outline: 2px solid var(--tool-ring); outline-offset: 1px;">
              <dc-import name="IconGlyph" d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2" size="10" stroke="1.6" hint-size="10px,10px"></dc-import>
            </button>
          </span>
        </sc-for>
        <sc-if value="{{ manySelections }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ clearSelections }}" style="height: 22px; padding: 0 7px; border: 0; background: transparent; color: var(--tool-muted); font-size: 11px; cursor: pointer; border-radius: var(--tool-radius-sm);" style-hover="background: var(--tool-hover); color: var(--tool-text);" style-focus="outline: 2px solid var(--tool-ring); outline-offset: 1px;">全部清掉</button>
        </sc-if>
      </div>
    </sc-if>
    <div style="display: flex; gap: 8px; align-items: flex-end;">
      <textarea ref="{{ inputRef }}" onInput="{{ onInput }}" onKeyDown="{{ onKey }}" rows="1" style="flex: 1 1 0; padding: 8px 12px; font-size: 13px; border: 1px solid var(--tool-border-strong); border-radius: var(--tool-radius); background: var(--tool-panel); color: var(--tool-text); resize: none; font-family: inherit; line-height: 1.5; max-height: 120px; box-sizing: border-box;" style-focus="border-color: var(--tool-accent); outline: none; box-shadow: 0 0 0 2px var(--tool-accent-soft);" placeholder="输入消息… ⏎ 发送"></textarea>
      <!-- 一个控件位，两种状态：跑着就是「中断」，否则是「发送」。 -->
      <sc-if value="{{ isRunning }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ onInterrupt }}" style="flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; font-size: 13px; border: 1px solid var(--tool-err-border); border-radius: var(--tool-radius); background: var(--tool-err-soft); color: var(--tool-err); cursor: pointer; font-weight: 560;" style-hover="background: var(--tool-panel);" style-focus="outline: 2px solid var(--tool-ring); outline-offset: 2px;">
          <span style="width: 8px; height: 8px; border-radius: 1px; background: currentColor;"></span>
          中断
          <kbd style="font-family: var(--tool-mono); font-size: 10px; padding: 0 4px; border-radius: 3px; border: 1px solid var(--tool-err-border);">Esc</kbd>
        </button>
      </sc-if>
      <sc-if value="{{ notRunning }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ onSend }}" style="flex: none; height: 36px; padding: 0 18px; font-size: 13px; border: none; border-radius: var(--tool-radius); background: {{ sendBg }}; color: {{ sendFg }}; cursor: pointer; font-weight: 560;" style-focus="outline: 2px solid var(--tool-ring); outline-offset: 2px;">发送</button>
      </sc-if>
    </div>
  </div>

  <!-- ═══ 底部状态栏 ═══ -->
  <div style="padding: 4px 12px; font-size: 10px; color: var(--tool-muted); border-top: 1px solid var(--tool-border); background: var(--tool-panel); display: flex; align-items: center; gap: 12px;">
    <span title="{{ usageTip }}">{{ usageLabel }}</span>
    <span style="flex: 1 1 0;"></span>
    <span>{{ footerLabel }}</span>
  </div>

</div>

</x-dc>

<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;跟随外层&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;跟随外层&quot;, &quot;tsType&quot;: &quot;'dark'|null&quot;, &quot;section&quot;: &quot;工具皮肤&quot; }}">

const DEMOS = [
  { n: 1, short: "正常对话", name: "正常的对话流程", note: "用户 + AI + 工具调用" },
  { n: 2, short: "流式输出", name: "AI 正在流式输出", note: "打字机效果 + 旋转动画" },
  { n: 3, short: "工具调用", name: "连续调用多个工具", note: "running / done 状态" },
  { n: 4, short: "中断", name: "运行中可中断", note: "显示中断按钮" },
  { n: 5, short: "空会话", name: "空会话 + 引导", note: "还没有消息" },
  { n: 6, short: "通道B", name: "使用通道 B（Claude Code）", note: "显示调用次数而非 token" },
  { n: 7, short: "选中节点", name: "选中节点后发给 AI", note: "输入框上方一颗 node 药丸；发出后消息里记一行带了什么" },
  { n: 8, short: "五种药丸", name: "一次带多个上下文", note: "node / range / region / files / dir 各一颗，可逐个 ×，也可全部清掉" }
];

/* 「已选中」五种（第四轮）。键：selections: [{ kind, label, detail }] */
const SEL_KIND = {
  node: "M4 2.8l8.4 4.4-3.6 1-1.8 3.4z",
  range: "M2 4.5v7M4.5 4h9M4.5 6.7h9M4.5 9.4h9M4.5 12h5.5",
  region: "M2.5 5V2.5H5M11 2.5h2.5V5M13.5 11v2.5H11M5 13.5H2.5V11",
  files: "M5.4 4.6h6.8V14H5.4zM3.4 12V2h6.4",
  dir: "M2 4.4c0-.5.4-.9.9-.9h3.2l1.5 1.6h5.5c.5 0 .9.4.9.9v6.6c0 .5-.4.9-.9.9H2.9c-.5 0-.9-.4-.9-.9z"
};
const DEMO_SEL = {
  7: [{ kind: "node", label: "重试按钮", detail: "PC 端/日志.dc.html › n42 · L245 · style.fontSize = '12px'" }],
  8: [
    { kind: "node", label: "button.primary", detail: "PC 端/日志.dc.html › n42" },
    { kind: "range", label: "需求.md L9–12", detail: "最近 7 天 …" },
    { kind: "region", label: "首页截图.png (120,640 210×44)", detail: "这个按钮的颜色是什么" },
    { kind: "files", label: "2 个文件", detail: "需求.md、首页截图.png" },
    { kind: "dir", label: "PC 端/", detail: "6 项" }
  ]
};

class Component extends DCLogic {
/* ref 用类字段建：renderVals 首次渲染就会被调用，
   那时 componentDidMount 还没跑，ref 会是 undefined。 */
  inputRef = React.createRef();

  state = { demo: 1, channel: "a", input: "", sel: null };

  selections() { return this.state.sel || DEMO_SEL[this.state.demo] || []; }

  goBack() {}

  renderVals() {
    const s = this.state;
    const demo = DEMOS[s.demo - 1];

    const messages = this.demoMessages(s.demo).map((m) => {
      if (!m.tools) return m;
      return Object.assign({}, m, {
        tools: m.tools.map((t) => {
          const failed = /error|失败|被拒/.test(t.result || "") && !/0 errors/.test(t.result || "");
          return Object.assign({}, t, {
            tip: t.name + "(" + t.args + ")" + (t.result ? "  →  " + t.result : ""),
            resultLabel: t.running ? "运行中…" : (t.result || ""),
            resultFg: failed ? "var(--tool-err)" : t.running ? "var(--tool-accent)" : "var(--tool-muted)",
            bd: t.running ? "var(--tool-accent-border)" : "var(--tool-border)",
            bg: t.running ? "var(--tool-accent-soft)" : "var(--tool-panel-2)"
          });
        })
      });
    });
    const isRunning = s.demo === 2 || s.demo === 3 || s.demo === 4;
    const streaming = s.demo === 2;
    const streamContent = "好的，我来把这里的字号调大一点，然后更新一下行高——";

    const sendBg = s.input ? "var(--tool-accent)" : "var(--tool-border-strong)";
    const sendFg = "var(--tool-on-accent)";

    /* 用量（设计侧 §2.3）：底栏只留一个人会拿来停手的数字 —— 花费（或调用次数）。
       token 数是诊断用的，收进 title 里，不占常驻位置。 */
    let usageLabel = "";
    let usageTip = "";
    if (s.channel === "a") {
      usageLabel = "通道 A · ¥0.13";
      usageTip = "1,284 tokens · 4 次工具调用 · 模型 deepseek-chat";
    } else {
      usageLabel = "通道 B · 第 3 次调用";
      usageTip = "订阅制，不按 token 计费 · Claude Code headless";
    }

    const sels = this.selections();
    return {
      hasSelections: sels.length > 0,
      manySelections: sels.length > 1,
      selections: sels.map((p, i) => ({ kind: p.kind, label: p.label, detail: p.detail, icon: SEL_KIND[p.kind] || "M0 0",
        remove: () => this.setState({ sel: sels.filter((_, j) => j !== i) }) })),
      clearSelections: () => this.setState({ sel: [] }),
      showDemoBar: true,
      demoNote: demo.note,
      goBack: () => this.goBack(),
      inputRef: this.inputRef,
      theme: this.props.theme === "dark" ? "dark" : null,
      sessionInfo: s.channel === "a" ? "通道 A（DeepSeek）· 2 条消息" : "通道 B（Claude Code headless）· 2 条消息",
      isRunning: isRunning,
      notRunning: !isRunning,
      streaming: streaming,
      streamContent: streamContent,
      sendBg: sendBg,
      sendFg: sendFg,
      onInput: (e) => this.setState({ input: e.target.value }),
      onKey: (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); this.onSend(); } },
      onSend: () => this.setState({ input: "" }),
      onInterrupt: () => {},

      // 通道切换
      chanABg: s.channel === "a" ? "var(--tool-accent)" : "transparent",
      chanAFg: s.channel === "a" ? "white" : "var(--tool-text)",
      chanAFw: s.channel === "a" ? "560" : "400",
      chanBBg: s.channel === "b" ? "var(--tool-accent)" : "transparent",
      chanBFg: s.channel === "b" ? "white" : "var(--tool-text)",
      chanBFw: s.channel === "b" ? "560" : "400",
      onChannelA: () => this.setState({ channel: "a" }),
      onChannelB: () => this.setState({ channel: "b" }),

      // 消息
      messages: messages,
      usageLabel: usageLabel,
      usageTip: usageTip,
      footerLabel: "当前演示态 " + (demo ? demo.name : ""),

      // 演示态
      demoStates: DEMOS.map((d) => ({
        n: d.n, name: d.name, active: d.n === s.demo,
        short: d.short, note: d.note,
        bg: s.demo === d.n ? "var(--tool-accent)" : "transparent",
        fg: s.demo === d.n ? "white" : "var(--tool-text)",
        bd: s.demo === d.n ? "var(--tool-accent)" : "var(--tool-border)",
        fw: s.demo === d.n ? "560" : "400",
        pick: () => this.setState({ demo: d.n, input: "", sel: null })
      }))
    };
  }

  demoMessages(demo) {
    if (demo === 1 || demo === 7) {
      const msgs = [
        { isSystem: true, content: "会话开始 · 通道 A · 模型 deepseek-chat" },
