<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UmbraDesign</title>
<link rel="stylesheet" href="./_ds-tool/tokens.css">
<style>
  /* ── 应用前端（M3-8）。八条形制决策 UI-1..UI-8 已由设计侧裁决（doc/14 §0.4），本文件照着落地（doc/12 M5-10）。
     皮肤：全部走 --tool-* token（UI-8），浅色默认，深色挂 html[data-tool-theme="dark"]，跟随系统由 JS 设。 */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: var(--tool-bg, #f6f7f9);
    --panel: var(--tool-panel, #ffffff);
    --panel2: var(--tool-panel-2, #f0f2f5);
    --text: var(--tool-text, #191c21);
    --text2: var(--tool-text-2, #495059);
    --muted: var(--tool-muted, #79818d);
    --border: var(--tool-border, #e1e5ea);
    --border-strong: var(--tool-border-strong, #c7cdd6);
    --accent: var(--tool-accent, #3a49cf);
    --accent-hover: var(--tool-accent-hover, #2f3cb0);
    --accent-soft: var(--tool-accent-soft, #ecefff);
    --on-accent: var(--tool-on-accent, #ffffff);
    --hover: var(--tool-hover, #eceff4);
    --ok: var(--tool-ok, #14795c);
    --ok-soft: var(--tool-ok-soft, #e3f3ee);
    --warn: var(--tool-warn, #8c5a00);
    --warn-soft: var(--tool-warn-soft, #fcf1da);
    --warn-border: var(--tool-warn-border, #e6cd9a);
    --err: var(--tool-err, #ba2318);
    --err-soft: var(--tool-err-soft, #fcebe9);
    --unchecked: var(--tool-unchecked, #79818d);
    --unchecked-soft: var(--tool-unchecked-soft, #f0f2f5);
    --ring: var(--tool-ring, #3a49cf);
    --shadow-2: var(--tool-shadow-2, 0 6px 20px rgba(20, 26, 36, 0.1));
    --sans: var(--tool-sans, system-ui, -apple-system, sans-serif);
    --mono: var(--tool-mono, ui-monospace, 'SF Mono', Menlo, monospace);
    --radius-sm: var(--tool-radius-sm, 4px);
    --radius: var(--tool-radius, 6px);
    --radius-lg: var(--tool-radius-lg, 10px);
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  input, button, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ── Top Bar ── */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px;
            border-bottom: 1px solid var(--border); background: var(--panel);
            flex-shrink: 0; z-index: 10; min-height: 46px; position: relative; }
  .topbar-logo { display: flex; align-items: center; gap: 8px; font-weight: 620; font-size: 14px;
                 letter-spacing: -0.01em; color: var(--text); }
  .topbar-logo svg { color: var(--accent); flex: none; }
  .topbar-sep { width: 1px; height: 20px; background: var(--border); flex: none; }
  .topbar-project { display: flex; align-items: center; gap: 6px; font-size: 12px; min-width: 0; }
  .topbar-project-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-project-title { color: var(--muted); font-family: var(--mono); }
  .topbar-spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
         border: 1px solid var(--border); border-radius: var(--radius);
         background: var(--panel); color: var(--text); font-size: 12px; white-space: nowrap;
         transition: background 0.13s ease, border-color 0.13s ease; }
  .btn:hover { background: var(--hover); }
  .btn svg { width: 14px; height: 14px; flex: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 560; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--text2); }
  .btn.ghost:hover { background: var(--hover); color: var(--text); }
  .btn.sm { height: 24px; padding: 0 8px; font-size: 11px; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .topbar-status { font-size: 11px; color: var(--muted); }

  /* ── ⋯ 菜单（UI-6：顶栏到五颗就收进来） ── */
  .menu { position: absolute; top: 40px; right: 16px; min-width: 200px; background: var(--panel);
          border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-2);
          padding: 6px; z-index: 30; animation: fade-in 0.12s ease; }
  .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0;
               border-radius: var(--radius); background: transparent; color: var(--text); font-size: 12px; text-align: left; }
  .menu-item:hover { background: var(--hover); }
  .menu-item svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
  .menu-item.danger { color: var(--err); }
  .menu-sep { height: 1px; background: var(--border); margin: 6px 4px; }
  .menu-hint { font-size: 11px; color: var(--muted); padding: 4px 10px 6px; }

  /* ── Workspace ── */
  .workspace { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 280px; min-width: 200px; max-width: 400px; flex-shrink: 0;
             border-right: 1px solid var(--border); background: var(--panel);
             display: flex; flex-direction: column; overflow: hidden; }
  .preview { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .preview iframe { flex: 1; border: none; background: #fff; }
  .preview-toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px;
                     border-bottom: 1px solid var(--border); background: var(--panel);
                     font-size: 12px; flex-shrink: 0; }
  .preview-toolbar .preview-url { font-family: var(--mono); font-size: 11px; color: var(--muted);
                                   flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview-placeholder { flex: 1; display: flex; align-items: center; justify-content: center;
                         color: var(--muted); font-size: 14px; text-align: center;
                         flex-direction: column; gap: 8px; }
  .preview-placeholder svg { width: 48px; height: 48px; opacity: 0.3; }

  /* ── Sidebar ── */
  .sidebar-search { padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .sidebar-search input { width: 100%; height: 30px; padding: 0 10px; border: 1px solid var(--border);
                          border-radius: var(--radius); background: var(--bg); color: var(--text);
                          font-size: 12px; outline: none; }
  .sidebar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .sidebar-search input::placeholder { color: var(--muted); }
  .sidebar-filters { display: flex; gap: 4px; padding: 6px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
  .filter-pill { padding: 3px 8px; border-radius: 999px; font-size: 11px; cursor: pointer;
                 border: 1px solid var(--border); background: transparent; color: var(--muted);
                 transition: all 0.13s ease; }
  .filter-pill.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .filter-pill:hover:not(.active) { background: var(--hover); }
  .draft-list { flex: 1; overflow-y: auto; }
  .draft-list::-webkit-scrollbar { width: 6px; }
  .draft-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .draft-item { display: flex; align-items: flex-start; gap: 9px; padding: 8px 12px;
                border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s ease; }
  .draft-item:hover { background: var(--hover); }
  .draft-item.selected { background: var(--accent-soft); }
  /* UI-2：稿件图标走图形（页稿=文档、组件稿=六边形），路径与 S1 / IconGlyph 同一套 */
  .draft-icon { width: 22px; height: 22px; border-radius: var(--radius-sm); flex-shrink: 0;
                display: grid; place-items: center; margin-top: 1px; }
  .draft-icon svg { width: 12px; height: 12px; }
  .draft-icon.page { background: var(--panel2); color: var(--text2); }
  .draft-icon.component { background: var(--accent-soft); color: var(--accent); }
  .draft-info { flex: 1; min-width: 0; }
  .draft-title { font-weight: 560; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .draft-meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; align-items: center; }
  .draft-health { padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .draft-health.ok { background: var(--ok-soft); color: var(--ok); }
  .draft-health.warn { background: var(--warn-soft); color: var(--warn); }
  .draft-health.error { background: var(--err-soft); color: var(--err); }
  .draft-health.unchecked { background: var(--unchecked-soft); color: var(--unchecked); }
  /* UI-3：「渲染中」不是第五种健康色 —— spinner + 上次的健康色压到 55% */
  .draft-health.checking { opacity: 0.55; }
  .spinner-xs { width: 9px; height: 9px; border: 1.5px solid currentColor; border-right-color: transparent;
                border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }

  /* ── Bottom Panel（UI-1：两档 220 / 半屏 + 拖拽把手，收起留 32px 条） ── */
  .bottom-panel { border-top: 1px solid var(--border); background: var(--panel);
                  display: flex; flex-direction: column; flex-shrink: 0; position: relative; }
  .bottom-panel.collapsed { height: 32px !important; }
  .bottom-grip { position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: row-resize; z-index: 2; }
  .bottom-grip:hover, .bottom-grip.dragging { background: var(--accent); opacity: 0.6; }
  .bottom-panel.collapsed .bottom-grip { display: none; }
  .bottom-tabs { display: flex; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; height: 32px; padding-right: 8px; }
  .bottom-tab { height: 32px; padding: 0 14px; font-size: 12px; cursor: pointer; border: none;
                background: transparent; color: var(--muted); position: relative; transition: color 0.13s ease; }
  .bottom-tab.active { color: var(--text); }
  .bottom-tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--accent); }
  .bottom-tab:hover:not(.active) { background: var(--hover); }
  .bottom-tab .badge { background: var(--err); color: #fff; border-radius: 999px; font-size: 9px; padding: 1px 5px; margin-left: 4px; vertical-align: top; }
  .bottom-tools { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .bottom-content { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 12px; }
  .bottom-panel.collapsed .bottom-content { display: none; }
  .bottom-content::-webkit-scrollbar { width: 6px; }
  .bottom-content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .diag-row { display: flex; gap: 8px; padding: 4px 0; align-items: baseline; }
  .diag-level { width: 48px; flex-shrink: 0; font-size: 10px; font-weight: 600; text-transform: uppercase; }
  .diag-level.error { color: var(--err); }
  .diag-level.warning { color: var(--warn); }
  .diag-level.info { color: var(--accent); }
  .diag-code { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 140px; flex-shrink: 0; }
  .diag-msg { flex: 1; }
  .diag-file { font-family: var(--mono); font-size: 10px; color: var(--muted); flex-shrink: 0; }
  .empty-note { color: var(--muted); text-align: center; padding: 20px; }

  /* ── 面板 / 对话（UI-7 新建项目、新建稿件、项目设置） ── */
  .scrim { position: fixed; inset: 0; background: rgba(20, 26, 36, 0.35); z-index: 40; display: flex; align-items: center; justify-content: center; animation: fade-in 0.12s ease; }
  .sheet { width: 520px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--border);
           border-radius: var(--radius-lg); box-shadow: var(--shadow-2); padding: 18px 20px 16px; }
  .sheet.wide { width: 960px; }
  .sheet h2 { font-size: 15px; font-weight: 620; letter-spacing: -0.01em; margin-bottom: 4px; }
  .sheet .sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
  .field { display: grid; grid-template-columns: 88px 1fr; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
  .field label { font-size: 12px; color: var(--text2); }
  .field input[type=text], .field select { height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius);
                 background: var(--bg); color: var(--text); font-size: 12px; outline: none; width: 100%; }
  .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .field input.invalid { border-color: var(--err); }
  .field .row { display: flex; gap: 6px; align-items: center; }
  .field .row input { flex: 1; }
  .field-note { grid-column: 2; font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: -4px; }
  .field-note.err { color: var(--err); }
  .field-note.warn { color: var(--warn); }
  .notice { border: 1px solid var(--warn-border); background: var(--warn-soft); color: var(--warn); border-radius: var(--radius);
            padding: 9px 11px; font-size: 12px; line-height: 1.5; margin: 4px 0 12px; display: flex; gap: 10px; align-items: center; }
  .notice .grow { flex: 1; }
  .sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .radio-row { display: flex; gap: 6px; }
  .radio-row button { height: 28px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); font-size: 12px; }
  .radio-row button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 560; }
  .kv { display: grid; grid-template-columns: 100px 1fr; gap: 6px 12px; }
  .kv span:nth-child(odd) { color: var(--muted); }

  /* ── AI 会话侧栏（M2-12，形制照 S9 / 设计侧 §2.3）：默认 380px 可拖 320–520；收起成 36px 竖条，条上留通道字母 + 未读点 ── */
  .chat-resize { width: 4px; cursor: col-resize; background: transparent; transition: background 0.1s; flex-shrink: 0; }
  .chat-resize:hover { background: var(--accent); }
  .chat-rail { width: 380px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--panel);
               display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .chat-rail.collapsed { width: 36px; }
  .chat-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); min-height: 42px; }
  .chat-head .title { font-size: 13px; font-weight: 560; }
  .chat-head .sub { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .chat-strip { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; height: 100%; cursor: pointer; }
  .chat-strip .ch { width: 22px; height: 22px; border-radius: var(--radius-sm); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
  .chat-strip .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--accent); }
  .chat-strip .dot.spin { width: 11px; height: 11px; border: 1.5px solid var(--accent); border-right-color: transparent; background: transparent; animation: spin 0.9s linear infinite; }
  .chat-strip .vt { writing-mode: vertical-rl; font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
  .chat-body { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 12px; }
  .chat-body::-webkit-scrollbar { width: 6px; }
  .chat-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .msg-user { display: flex; justify-content: flex-end; }
  .msg-user > div { max-width: 82%; padding: 9px 13px; border-radius: 12px 12px 4px 12px; background: var(--accent); color: var(--on-accent); font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .turn { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; }
  .turn-rail { display: flex; flex-direction: column; align-items: center; }
  .turn-rail .dot { width: 7px; height: 7px; flex: none; margin-top: 5px; border-radius: 999px; background: var(--accent); }
  .turn-rail .dot.spin { width: 11px; height: 11px; margin-top: 3px; border: 1.5px solid var(--accent); border-right-color: transparent; background: transparent; animation: spin 0.9s linear infinite; }
  .turn-rail .line { flex: 1; width: 2px; margin-top: 4px; border-radius: 1px; background: var(--accent-soft); }
  .turn-text { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .turn-text.streaming { padding-bottom: 5px; border-bottom: 2px solid var(--accent); }
  .tool-rows { margin-top: 7px; display: grid; gap: 3px; }
  .tool-row { display: flex; align-items: center; gap: 7px; min-width: 0; height: 24px; padding: 0 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel2); font-size: 11px; }
  .tool-row.err { border-color: var(--err); }
  .tool-row .nm { flex: none; font-weight: 560; font-family: var(--mono); }
  .tool-row .args { color: var(--muted); font-family: var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-row .res { margin-left: auto; flex: none; font-family: var(--mono); max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ok); }
  .tool-row.err .res { color: var(--err); }
  .msg-sys { text-align: center; font-size: 11px; color: var(--muted); padding: 2px 0; }
  .msg-change { border: 1px solid var(--warn-border); background: var(--warn-soft); color: var(--warn); border-radius: var(--radius); padding: 7px 10px; font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .msg-change .grow { flex: 1; min-width: 0; }
  .picked-pill { display: flex; align-items: center; gap: 8px; margin: 0 12px; padding: 5px 8px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: var(--radius); font-size: 11px; }
  .picked-pill .nm { font-weight: 600; flex: none; }
  .picked-pill .mono { font-family: var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picked-pill .grow { flex: 1; }
  .draft-item:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
  .chat-compose { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
  .chat-compose textarea { flex: 1; min-height: 36px; max-height: 140px; padding: 8px 12px; font-size: 13px; line-height: 1.45; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); resize: none; outline: none; }
  .chat-compose textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .btn.stop { border-color: var(--err); color: var(--err); background: var(--err-soft); }
  .btn.stop .sq { width: 8px; height: 8px; border-radius: 1px; background: currentColor; }
  .chat-foot { padding: 4px 12px; font-size: 10px; color: var(--muted); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .chat-foot .grow { flex: 1; }
  .chat-empty { margin: auto; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; padding: 20px; }
  .chat-empty b { color: var(--text); }

  /* ── Welcome ── */
  .welcome { flex: 1; display: flex; align-items: center; justify-content: center; }
  .welcome-inner { text-align: center; max-width: 520px; padding: 40px; }
  .welcome h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .welcome h1 span { color: var(--accent); }
  .welcome-sub { color: var(--muted); margin-bottom: 32px; font-size: 14px; }
  .welcome-actions { display: flex; gap: 12px; justify-content: center; margin-bottom: 32px; }
  .welcome-btn { display: flex; align-items: center; gap: 10px; padding: 14px 24px;
                 border: 1px solid var(--border); border-radius: var(--radius-lg);
                 background: var(--panel); color: var(--text); font-size: 14px; text-align: left;
                 transition: all 0.15s ease; cursor: pointer; }
  .welcome-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .welcome-btn svg { width: 24px; height: 24px; color: var(--accent); flex: none; }
  .welcome-btn-label { font-weight: 600; }
  .welcome-btn-desc { font-size: 12px; color: var(--muted); display: block; margin-top: 2px; }
  .welcome-recent { text-align: left; }
  .welcome-recent h3 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .welcome-recent-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--radius); cursor: pointer; transition: background 0.1s; }
  .welcome-recent-item:hover { background: var(--hover); }
  .welcome-recent-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--ok); flex: none; }
  .welcome-recent-name { font-weight: 600; }
  .welcome-recent-path { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-left: 8px; }

  /* ── Toast ── */
  .toast-container { position: fixed; bottom: 44px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
  .toast { padding: 10px 16px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); font-size: 12px;
           animation: fade-in 0.2s ease; box-shadow: var(--shadow-2); max-width: 360px; }
  .toast.error { border-color: var(--err); }
  .toast.success { border-color: var(--ok); }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .resize-handle { width: 4px; cursor: col-resize; background: transparent; transition: background 0.1s; flex-shrink: 0; }
  .resize-handle:hover { background: var(--accent); }
</style>
</head>
<body>
<div id="app"><!-- 由 JS 渲染 --></div>
<div class="toast-container" id="toasts"></div>

<script>
// ── Tauri invoke 封装 ──────────────────────────────────
const T = typeof window.__TAURI__ !== 'undefined' ? window.__TAURI__ : null;

async function invoke(cmd, args) {
  if (!T) return mockInvoke(cmd, args);
  try {
    return await T.core.invoke(cmd, args);
  } catch (e) {
    console.error(`[invoke] ✗ ${cmd}`, e);
    throw e;
  }
}

// MCP 工具调用的返回格式：{ content: [{ type: "text", text: "JSON字符串" }], isError }
function parseMcpResult(raw) {
  if (!raw) return null;
  if (raw.content && Array.isArray(raw.content) && raw.content.length > 0) {
    try { return JSON.parse(raw.content[0].text); } catch (e) { return raw; }
  }
  return raw;
}

/* MCP 工具的 project 参数：projects/ 根之外的项目用绝对目录（loadProject 认绝对路径，doc/00 §三十八） */
function projectRef() { return (state.project && (state.project.dir || state.project.name)) || ''; }
async function mcp(tool, args) {
  return parseMcpResult(await invoke('invoke_mcp_command', { tool, args, msgId: Date.now() }));
}

// 没有 Tauri（浏览器里直接开这一页）时的兜底。带 ?url=&token= 可以只靠本地 API 看真项目 —— 给开发验收用。
async function mockInvoke(cmd, args) {
  if (cmd === 'get_sidecar_status') return { status: state.project ? 'running' : 'stopped' };
  if (cmd === 'get_recent_projects_command') return { projects: [] };
  if (cmd === 'invoke_mcp_command') {
    return { content: [{ type: 'text', text: JSON.stringify({ ok: false, errors: [{ code: 'E_NO_TAURI', message: '浏览器调试模式没有 MCP 通道，这一步要在应用里做' }] }) }] };
  }
  return {};
}

// ── 应用状态 ──────────────────────────────────────────
const state = {
  sidecar: 'checking',
  project: null,          // { name, title, dir, url, token }
  drafts: [],
  selectedDraft: null,
  search: '',
  filter: 'all',
  validating: false,
  checkingFile: null,     // UI-3：正在体检的稿
  diags: [],
  changes: [],
  bottomTab: 'diags',     // diags | changes | info
  bottomMode: load('ud.bottomMode', 'normal'),   // normal | half | collapsed（UI-1）
  bottomHeight: Number(load('ud.bottomHeight', 220)),
  theme: load('ud.theme', 'system'),             // system | light | dark（UI-8）
  menuOpen: false,
  sheet: null,            // null | 'newProject' | 'newDraft' | 'settings'
  form: {},
  previewMode: load('ud.previewMode', 'shell'),   // shell = 经 S2 预览壳（可点选、可改属性）；raw = 稿本身
  picked: null,           // 方式 ②：S2 壳 postMessage 上来的选中节点 { file, node, tag }
  chat: {                 // M2-12：AI 会话侧栏
    open: load('ud.chatOpen', '1') === '1',
    width: Number(load('ud.chatWidth', 380)),
    channel: load('ud.chatChannel', 'a'),
    sessionId: null,
    messages: [],         // 会话文件里的条目（user / assistant / tool / system）
    notes: [],            // 本地追加的说明条（变更摘要、错误），不落盘
    running: false,
    input: '',
    usage: null,
    unread: false,
    sessions: [],
    abort: null,
  },
};

function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* ignore */ } }

const appEl = document.getElementById('app');

// ── 主题（UI-8）：浅 / 深 / 跟随系统，默认跟随系统 ──
const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme() {
  const t = state.theme === 'system' ? (mq && mq.matches ? 'dark' : 'light') : state.theme;
  document.documentElement.setAttribute('data-tool-theme', t);
}
if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);
function setTheme(t) { state.theme = t; save('ud.theme', t); applyTheme(); render(); }

// ── 渲染 ──────────────────────────────────────────────
function render() {
  if (!state.project) renderWelcome(); else renderWorkspace();
  renderSheet();
}

const ICON = {
  page: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.6" y="2" width="10.8" height="12" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M5 5.6h6M5 8.2h6M5 10.8h3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
  component: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.8l5.2 3v6.4L8 14.2 2.8 11.2V4.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
  logo: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3.2" stroke="currentColor" stroke-width="1.4"/><path d="M5 8.2h6M5 5.4h6M5 11h3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  plus: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3.6v8.8M3.6 8h8.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  more: '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>',
  refresh: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.8v2.6h-2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  ext: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M7 3H3.5v9.5H13V9M9 3h4v4M13 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  gear: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4L5 11M11 5l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  close: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  check: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.4l3 3 7-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  compare: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="3" width="5" height="10" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="3" width="5" height="10" rx="1.2" stroke="currentColor" stroke-width="1.3"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>',
};

// ── Welcome 屏 ──────────────────────────────────────
async function renderWelcome() {
  let recent = [];
  try {
    const r = parseMcpResult(await invoke('get_recent_projects_command'));
    recent = r?.projects || [];
  } catch (e) { /* ignore */ }

  appEl.innerHTML = `
    <div class="topbar">
      <div class="topbar-logo">${ICON.logo} UmbraDesign</div>
      <div class="topbar-spacer"></div>
      <button class="btn ghost sm" onclick="openSheet('settings')" title="主题">${ICON.gear} 外观</button>
      <span class="topbar-status">sidecar: ${state.sidecar === 'running' ? '运行中' : state.sidecar === 'stopped' ? '已停止' : '检测中…'}</span>
    </div>
    <div class="welcome">
      <div class="welcome-inner">
        <h1><span>UmbraDesign</span></h1>
        <p class="welcome-sub">本地 PC 端设计软件 · 打开或创建项目开始</p>
        <div class="welcome-actions">
          <button class="welcome-btn" onclick="handleOpenProject()">
            ${ICON.folder}
            <div><span class="welcome-btn-label">打开项目</span><span class="welcome-btn-desc">选择已有的项目目录</span></div>
          </button>
          <button class="welcome-btn" onclick="openSheet('newProject')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <div><span class="welcome-btn-label">新建项目</span><span class="welcome-btn-desc">创建一个新的设计项目</span></div>
          </button>
        </div>
        ${recent.length ? `
          <div class="welcome-recent">
            <h3>最近项目</h3>
            ${recent.map(p => `
              <div class="welcome-recent-item" onclick="handleOpenPath('${escHtml(p)}')">
                <span class="welcome-recent-dot"></span>
                <span class="welcome-recent-name">${escHtml(baseName(p))}</span>
                <span class="welcome-recent-path">${escHtml(p)}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

// ── Workspace 屏 ─────────────────────────────────────
function renderWorkspace() {
  const p = state.project;
  const filtered = filterDrafts();
  const bottomStyle = state.bottomMode === 'half' ? 'height: 50vh;' : `height: ${state.bottomHeight}px;`;

  appEl.innerHTML = `
    <div class="topbar">
      <div class="topbar-logo">${ICON.logo} UmbraDesign</div>
      <div class="topbar-sep"></div>
      <div class="topbar-project">
        <span class="topbar-project-name" title="${escHtml(p.dir)}">${escHtml(p.name)}</span>
        ${p.title ? `<span class="topbar-project-title">${escHtml(p.title)}</span>` : ''}
      </div>
      <span class="topbar-status">${state.drafts.length} 份稿</span>
      <div class="topbar-spacer"></div>
      <!-- UI-6：顶栏一颗实心「新建稿件」；其余常用操作收进 ⋯，顶栏不会长到五颗 -->
      <button class="btn primary" onclick="openSheet('newDraft')">${ICON.plus} 新建稿件</button>
      <button class="btn" onclick="toggleMenu(event)" title="更多" aria-haspopup="true" aria-expanded="${state.menuOpen}">${ICON.more}</button>
      ${state.menuOpen ? `
        <div class="menu" id="menu">
          <button class="menu-item" onclick="closeMenu(); handleBuildIndex()">${ICON.refresh} 重建索引</button>
          <button class="menu-item" onclick="closeMenu(); handleOpenInBrowser()" ${state.selectedDraft ? '' : 'disabled'}>${ICON.ext} 在浏览器打开当前稿</button>
          <button class="menu-item" onclick="closeMenu(); openSheet('settings')">${ICON.gear} 项目设置 · 外观</button>
          <div class="menu-sep"></div>
          <button class="menu-item danger" onclick="closeMenu(); handleCloseProject()">${ICON.close} 关闭项目</button>
        </div>` : ''}
    </div>

    <div class="workspace">
      <div class="sidebar">
        <div class="sidebar-search">
          <input type="text" value="${escHtml(state.search)}" placeholder="搜稿名、文件名、演示态…" onInput="onSearch(event.target.value)" />
        </div>
        <div class="sidebar-filters">
          ${filterPill('all', '全部')}${filterPill('page', '页稿')}${filterPill('component', '组件稿')}

        </div>
        <div class="draft-list" role="listbox" aria-label="稿件列表">
          ${filtered.length === 0 ? '<div class="empty">没有匹配的稿</div>' : filtered.map(d => draftItemHtml(d)).join('')}
        </div>
      </div>
      <div class="resize-handle" id="resizeHandle"></div>
      <div class="preview">
        ${state.selectedDraft ? `

            <span class="preview-url" title="${escHtml(p.url + state.selectedDraft)}">${escHtml(state.selectedDraft)}</span>
            <div class="radio-row" title="编辑壳：能点选节点、改属性（方式 ①）、把选中节点带给 AI（方式 ②）；稿本身：原样预览">
              <button class="${state.previewMode === 'shell' ? 'on' : ''}" style="height:24px;padding:0 8px;font-size:11px;" onclick="setPreviewMode('shell')">编辑壳</button>
              <button class="${state.previewMode === 'raw' ? 'on' : ''}" style="height:24px;padding:0 8px;font-size:11px;" onclick="setPreviewMode('raw')">稿本身</button>
            </div>
            <button class="btn sm" onclick="handleValidate()" ${state.validating ? 'disabled' : ''}>${ICON.check} ${state.validating ? '体检中…' : '体检'}</button>
            <button class="btn sm" onclick="handleOpenInBrowser()" title="在浏览器中打开">${ICON.ext} 浏览器</button>

            <div>在左侧选择一份稿件预览</div>

      </div>
      <div class="chat-resize" id="chatResize" style="${state.chat.open ? '' : 'display:none'}"></div>

    <!-- UI-1：底栏两档 + 拖拽把手；收起留 32px 条（tab 仍在，随时展开） -->

  wireChatRail();
}

// ── AI 会话侧栏（M2-12） ─────────────────────────────
function renderChatRail() {
  const c = state.chat;
  if (!c.open) {
    return `<div class="chat-rail collapsed"><div class="chat-strip" onclick="toggleChatRail()" title="展开 AI 会话">
      <span class="ch">${c.channel.toUpperCase()}</span>
      ${c.running ? '<span class="dot spin" title="AI 还在跑"></span>' : c.unread ? '<span class="dot" title="有新回复"></span>' : ''}
      <span class="vt">AI 会话</span>
    </div></div>`;
  }
  const rows = [];
  const toolResults = new Map();
  for (const m of c.messages) if (m.role === 'tool' && m.toolCallId) toolResults.set(m.toolCallId, m.content);
  // 一个 AI 回合 = 从用户那句之后到下一句用户之前的全部 assistant / tool 条目，共用一根左栏（S9 §2.3：工具调用是上面那句话的证据）
  const toolRow = (tc) => {
    const name = tc.function?.name || '?';
    let args = tc.function?.arguments || '';
    try { const o = JSON.parse(args); delete o.project; args = Object.entries(o).map(([k, v]) => `${k}=${typeof v === 'string' ? v : JSON.stringify(v)}`).join(', '); } catch (e) { /* 原样 */ }
    const raw = toolResults.get(tc.id);
    let ok = true, res = '…';
    if (raw !== undefined) {
      try { const r = JSON.parse(raw); ok = r.ok !== false; res = ok ? (r.version ? r.version : r.written === false ? '未落盘' : 'ok') : (r.error || 'error'); }
      catch (e) { res = String(raw).slice(0, 40); }
    }
    return `<div class="tool-row ${ok ? '' : 'err'}" title="${escHtml(args)}\n→ ${escHtml(String(raw || '').slice(0, 400))}"><span class="nm">${escHtml(name)}</span><span class="args">${escHtml(args)}</span><span class="res">${escHtml(res)}</span></div>`;
  };
  let turn = null;   // { parts: [] } —— 文本与工具行按出现顺序排
  const flush = () => {
    if (!turn || !turn.parts.length) { turn = null; return; }
    rows.push(`<div class="turn"><div class="turn-rail"><span class="dot"></span><span class="line"></span></div><div>${turn.parts.join('')}</div></div>`);
    turn = null;
  };
  for (const m of c.messages) {
    if (m.role === 'user') { flush(); rows.push(`<div class="msg-user"><div>${escHtml(m.content)}</div></div>`); }
    else if (m.role === 'assistant') {
      if (!turn) turn = { parts: [] };
      if (m.content) turn.parts.push(`<div class="turn-text" style="${turn.parts.length ? 'margin-top:7px' : ''}">${escHtml(m.content)}</div>`);
      if (m.toolCalls && m.toolCalls.length) turn.parts.push(`<div class="tool-rows" style="${turn.parts.length ? '' : 'margin-top:0'}">${m.toolCalls.map(toolRow).join('')}</div>`);
    } else if (m.role === 'system') { flush(); rows.push(`<div class="msg-sys">${escHtml(m.content)}</div>`); }
  }
  flush();
  for (const n of c.notes) {
    if (n.kind === 'change') rows.push(`<div class="msg-change"><span class="grow">改了 <b>${escHtml(n.path)}</b> · ${escHtml(n.summary)}（${escHtml(n.from)} → ${escHtml(n.to)}）</span>
      ${n.reverted ? '<span>已回退</span>' : `<button class="btn sm" onclick="chatRevert(${n.idx})">回退到 ${escHtml(n.from)}</button>`}</div>`);
    else rows.push(`<div class="msg-sys">${escHtml(n.text)}</div>`);
  }
  if (c.running) rows.push(`<div class="turn"><div class="turn-rail"><span class="dot spin"></span><span class="line"></span></div><div><div class="turn-text streaming">正在读稿、调工具、落盘…</div></div></div>`);
  const usage = c.usage ? (c.usage.totalCostUSD != null ? `通道 B · $${Number(c.usage.totalCostUSD).toFixed(3)}` : `通道 ${c.channel.toUpperCase()} · ${(c.usage.totalTokens || 0).toLocaleString()} tokens`) : `通道 ${c.channel.toUpperCase()}`;
  return `<div class="chat-rail" id="chatRail" style="width:${c.width}px">
    <div class="chat-head">
      <div style="flex:1;min-width:0"><div class="title">AI 会话</div><div class="sub">${c.sessionId ? c.sessionId.slice(0, 8) + ' · ' + c.messages.filter(m => m.role === 'user').length + ' 条' : '新会话'}</div></div>
      <div class="radio-row">
        <button class="${c.channel === 'a' ? 'on' : ''}" onclick="setChatChannel('a')" title="直连 OpenAI 兼容端点" style="height:24px;padding:0 8px;font-size:11px;">A</button>
        <button class="${c.channel === 'b' ? 'on' : ''}" onclick="setChatChannel('b')" title="Claude Code 子进程" style="height:24px;padding:0 8px;font-size:11px;">B</button>
      </div>
      <button class="btn ghost sm" onclick="chatNewSession()" title="新会话">${ICON.plus}</button>
      <button class="btn ghost sm" onclick="toggleChatRail()" title="收起">${ICON.close}</button>
    </div>
    <div class="chat-body" id="chatBody">${rows.length ? rows.join('') : `<div class="chat-empty"><b>直接说要改什么</b><br>比如「把这个按钮改成 danger 态」。<br>AI 走唯一写入口落盘，改动可审、可回退。${state.selectedDraft ? '' : '<br>先在左侧选一份稿，AI 会优先看它。'}</div>`}</div>
    ${state.picked ? `<div class="picked-pill"><span class="nm">已选中</span><span class="mono">${escHtml(state.picked.tag ? '<' + state.picked.tag + '> ' : '')}${escHtml(state.picked.file)} · ${escHtml(state.picked.node)}</span><span class="grow"></span><button class="btn ghost sm" onclick="clearPicked()" title="不带这个节点">${ICON.close}</button></div>` : ''}
    <div class="chat-compose">
      <textarea id="chatInput" rows="1" placeholder="${state.picked ? '对这个节点说…（「这里字号大一点」）' : state.selectedDraft ? '对 ' + escHtml(state.selectedDraft) + ' 说…' : '输入消息… ⏎ 发送'}" oninput="state.chat.input=this.value" onkeydown="chatKey(event)">${escHtml(c.input)}</textarea>
      ${c.running ? `<button class="btn stop" onclick="chatInterrupt()"><span class="sq"></span> 中断 <kbd style="font-size:10px">Esc</kbd></button>` : `<button class="btn primary" onclick="chatSend()">发送</button>`}
    </div>
    <div class="chat-foot"><span>${usage}</span><span class="grow"></span><span>${c.running ? '运行中' : c.sessions.length ? c.sessions.length + ' 个会话' : ''}</span></div>
  </div>`;
}

function wireChatRail() {
  const h = document.getElementById('chatResize'), rail = document.getElementById('chatRail');
  if (!h || !rail) return;
  h.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const startX = e.clientX, startW = rail.offsetWidth;
    const onMove = (ev) => { const w = Math.max(320, Math.min(520, startW - (ev.clientX - startX))); rail.style.width = w + 'px'; state.chat.width = w; };
    const onUp = () => { save('ud.chatWidth', state.chat.width); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
  });
  const body = document.getElementById('chatBody');
  if (body) body.scrollTop = body.scrollHeight;
}

function toggleChatRail() { state.chat.open = !state.chat.open; if (state.chat.open) state.chat.unread = false; save('ud.chatOpen', state.chat.open ? '1' : '0'); render(); }
function setChatChannel(ch) { state.chat.channel = ch; save('ud.chatChannel', ch); render(); }
function chatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatSend(); }
  if (e.key === 'Escape' && state.chat.running) chatInterrupt();
}

async function chatLoad() {
  const c = state.chat;
  c.sessionId = null; c.messages = []; c.notes = []; c.usage = null; c.sessions = [];
  if (!state.project) return;
  try {
    const r = await apiFetch('chat_list');
    c.sessions = (r.data && r.data.sessions) || [];
    if (c.sessions.length) {
      const latest = c.sessions.slice().sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''))[0];
      const g = await apiFetch('chat_get?session=' + encodeURIComponent(latest.id));
      if (g.data) { c.sessionId = g.data.id; c.messages = g.data.messages || []; c.channel = g.data.channel || c.channel; }
    }
  } catch (e) { /* 没有会话也正常 */ }
  render();
}

function chatNewSession() { const c = state.chat; c.sessionId = null; c.messages = []; c.notes = []; c.usage = null; render(); }

async function chatSend() {
  const c = state.chat;
  const text = (c.input || '').trim();
  if (!text || c.running || !state.project) return;
  c.input = ''; c.running = true;
  c.messages = c.messages.concat([{ role: 'user', content: text, timestamp: new Date().toISOString() }]);
  render();
  const abort = new AbortController(); c.abort = abort;
  try {
    const body = { message: text, channel: c.channel };
    if (c.sessionId) body.sessionId = c.sessionId;
    // 方式 ②（选中节点）要等 S2 壳和前端打通；现在先把当前正在看的稿名当弱上下文送进系统提示（不进用户那句）
    if (state.selectedDraft) body.contextFile = state.selectedDraft;
    // 方式 ②：带上 S2 壳里选中的节点，服务端用 locateNode 解析成上下文塞进系统提示（M2-8）
    if (state.picked && state.picked.node) { body.selectedNodeFile = state.picked.file; body.selectedNodeAddress = state.picked.node; }
    const res = await apiFetch('chat_send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: abort.signal });
    const d = res.data || {};
    if (d.sessionId) c.sessionId = d.sessionId;
    if (res.errors && res.errors.length) c.notes.push({ kind: 'err', text: '出错：' + (res.errors[0].message || res.errors[0].code) });
    if (d.usage) c.usage = d.usage;
    if (d.interrupted) c.notes.push({ kind: 'err', text: '已中断' });
    for (const ch of d.changes || []) c.notes.push({ kind: 'change', idx: c.notes.length, path: ch.path, from: ch.from, to: ch.to, summary: ch.summary, reverted: false });
    if (c.sessionId) {
      const g = await apiFetch('chat_get?session=' + encodeURIComponent(c.sessionId));
      if (g.data) c.messages = g.data.messages || c.messages;
    }
    if ((d.changes || []).length) { reloadPreview(); fetchDrafts(); if (state.selectedDraft) fetchDiagnostics(state.selectedDraft); }
    if (!c.open) c.unread = true;
  } catch (e) {
    if (e.name === 'AbortError') c.notes.push({ kind: 'err', text: '已停止等待（服务端这一轮仍会跑完，落盘照常可审可回退）' });
    else c.notes.push({ kind: 'err', text: '发送失败：' + e.message });
  } finally {
    c.running = false; c.abort = null;
    render();
  }
}

function chatInterrupt() { const c = state.chat; if (c.abort) c.abort.abort(); }

async function chatRevert(idx) {
  const n = state.chat.notes[idx];
  if (!n || n.reverted) return;
  try {
    const r = await apiFetch('revert', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: n.path, version: n.from }) });
    if (r.ok) { n.reverted = true; toast('已退回 ' + n.from + '（历史不删，' + (r.data?.write?.version || '新一版') + ' 是回退版）', 'success'); reloadPreview(); fetchDrafts(); if (state.selectedDraft) fetchDiagnostics(state.selectedDraft); }
    else toast('回退失败：' + (r.errors?.[0]?.message || '未知错误'), 'error');
  } catch (e) { toast('回退失败：' + e.message, 'error'); }
  render();
}

function reloadPreview() { const f = document.getElementById('previewFrame'); if (f) f.src = f.src; }

/* 预览走 S2 预览壳（build_index 部署在项目根），它注入点选桥、带属性面板；?embed=1 让它收起「索引」链接并把选中节点 postMessage 上来。 */
function previewSrc() {
  const p = state.project;
  const raw = p.url + encodeURIComponent(state.selectedDraft).replace(/%2F/g, '/');
  if (state.previewMode !== 'shell') return raw;
  return p.url + encodeURIComponent('S2-单稿预览壳.dc.html') + '?file=' + encodeURIComponent(state.selectedDraft) + '&embed=1';
}
function setPreviewMode(m) { state.previewMode = m; save('ud.previewMode', m); state.picked = null; render(); }
// 方式 ②：S2 壳上报的选中 / 清除
window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.source !== 'umbradesign-s2') return;
  if (m.type === 'picked' && m.payload) { state.picked = { file: m.payload.file || state.selectedDraft, node: m.payload.node, tag: m.payload.tag || '' }; renderSheet(); render(); }
  if (m.type === 'cleared') { state.picked = null; render(); }
});
window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.source !== 'umbradesign-s8') return;
  if (m.type === 'project-gone') { toast('项目已移到 ' + (m.payload && m.payload.archivePath || '归档目录'), 'success'); state.sheet = null; handleCloseProject(); }
  if (m.type === 'drafts-changed') fetchDrafts();
});
function clearPicked() { state.picked = null; render(); }

function wireSidebarResize() {
  const handle = document.getElementById('resizeHandle');
  if (!handle) return;
  handle.addEventListener('mousedown', (e) => {
    const startX = e.clientX, startW = document.querySelector('.sidebar').offsetWidth;
    const onMove = (ev) => { document.querySelector('.sidebar').style.width = Math.max(200, Math.min(400, startW + ev.clientX - startX)) + 'px'; };
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function wireBottomGrip() {
  const grip = document.getElementById('bottomGrip'), panel = document.getElementById('bottomPanel');
  if (!grip || !panel) return;
  grip.addEventListener('dblclick', () => setBottomMode(state.bottomMode === 'half' ? 'normal' : 'half'));
  grip.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const startY = e.clientY, startH = panel.offsetHeight;
    grip.classList.add('dragging');
    const onMove = (ev) => {
      const h = Math.max(120, Math.min(Math.round(window.innerHeight * 0.8), startH + (startY - ev.clientY)));
      panel.style.height = h + 'px';
      state.bottomHeight = h; state.bottomMode = 'normal';
    };
    const onUp = () => {
      grip.classList.remove('dragging');
      save('ud.bottomHeight', state.bottomHeight); save('ud.bottomMode', 'normal');
      document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
      render();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function setBottomMode(m) { state.bottomMode = m; save('ud.bottomMode', m); render(); }
function toggleMenu(e) { e.stopPropagation(); state.menuOpen = !state.menuOpen; render(); }
function closeMenu() { state.menuOpen = false; }
document.addEventListener('click', (e) => { if (state.menuOpen && !e.target.closest('#menu')) { state.menuOpen = false; render(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (state.sheet) closeSheet(); else if (state.menuOpen) { state.menuOpen = false; render(); } else if (state.chat.running) chatInterrupt(); } });

function filterPill(key, label) {
  return `<button class="filter-pill ${state.filter === key ? 'active' : ''}" onclick="setFilter('${key}')">${label}</button>`;
}

function draftItemHtml(d) {
  const selected = state.selectedDraft === d.file ? ' selected' : '';

function diagBadge(level) {

}

function renderBottomContent() {
  if (!state.selectedDraft) return '<div class="empty-note">选择稿件后显示详情</div>';
  if (state.bottomTab === 'diags') {
    if (state.diags.length === 0) return '<div class="empty-note">暂无诊断 · 点「体检」跑一次 render_check</div>';
    return state.diags.map(d => `
      <div class="diag-row">

        <span class="diag-file">${escHtml(d.line ? 'L' + d.line : '')}</span>
      </div>`).join('');
  }
  if (state.bottomTab === 'changes') {

      <div class="diag-row">

    return `<div class="kv">

// ── 面板（sheet） ──────────────────────────────────────
function openSheet(kind) {
  state.menuOpen = false;
  state.sheet = kind;
  if (kind === 'newProject') state.form = { dir: '', name: '', title: '', info: null, busy: false };
  if (kind === 'newDraft') state.form = { name: '', title: '', source: 'blank', busy: false };
  render();
}
function closeSheet() { state.sheet = null; render(); }
function setForm(k, v) { state.form[k] = v; renderSheet(); }

function renderSheet() {
  const old = document.getElementById('sheet');
  // 设置面板里嵌着 S8 的 iframe：应用其他部分重绘（比如稿件列表刷新）时不能把它重建，否则 S8 会整个重载
  if (old && state.sheet === 'settings' && old.dataset.kind === 'settings') {
    old.querySelectorAll('.radio-row button').forEach((b, i) => b.classList.toggle('on', ['system', 'light', 'dark'][i] === state.theme));
    return;
  }
  if (old) old.remove();
  if (!state.sheet) return;
  const f = state.form;
  let body = '';

  if (state.sheet === 'settings') {
    // UI-8：主题三档放这里；项目级设置（基本信息 / 设计系统 / 限额 / 回收站 / 危险操作）嵌 S8 壳（?embed=1，走本地 API）
    const s8 = state.project ? state.project.url + encodeURIComponent('S8-项目设置.dc.html') + '?embed=1' : null;
    body = `
      <h2>项目设置</h2>
      <div class="field" style="margin-bottom:${s8 ? '8px' : '10px'}">
        <label>外观</label>
        <div class="radio-row">
          ${['system', 'light', 'dark'].map(t => `<button class="${state.theme === t ? 'on' : ''}" onclick="setTheme('${t}')">${{ system: '跟随系统', light: '浅色', dark: '深色' }[t]}</button>`).join('')}
          <span style="font-size:11px;color:var(--muted);align-self:center;margin-left:6px;">只影响工具皮肤，不影响稿自己的深浅色</span>
        </div>
      </div>
      ${s8 ? `<iframe src="${s8}" title="项目设置" style="display:block;width:100%;height:min(600px, calc(100vh - 200px));border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);"></iframe>` : '<p class="sub">打开一个项目后，这里还有设计系统、限额、回收站与危险操作。</p>'}
      <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">完成</button></div>`;
  }

  if (state.sheet === 'newDraft') {
    const name = (f.name || '').trim();
    const fileName = name ? (name.endsWith('.dc.html') ? name : name + '.dc.html') : '';
    const bad = name && /[\\/:*?"<>|]/.test(name);
    const cur = state.selectedDraft;
    body = `
      <h2>新建稿件</h2>
      <p class="sub">在项目根目录新建一份稿，走 create_draft（唯一写入口），建完自动选中。</p>
      <div class="field">
        <label>文件名</label>
        <input type="text" class="${bad ? 'invalid' : ''}" value="${escHtml(f.name || '')}" placeholder="例如：设置 · 账号与凭据" oninput="setForm('name', this.value)" autofocus />
        <div class="field-note ${bad ? 'err' : ''}">${bad ? '文件名不能含 \\ / : * ? " < > |' : fileName ? '将写入 ' + escHtml(fileName) : '会自动补 .dc.html'}</div>
      </div>
      <div class="field">
        <label>标题</label>
        <input type="text" value="${escHtml(f.title || '')}" placeholder="不填就用文件名" oninput="setForm('title', this.value)" />
      </div>
      <div class="field">
        <label>来源</label>
        <div class="radio-row">
          <button class="${f.source === 'blank' ? 'on' : ''}" onclick="setForm('source','blank')">空白骨架</button>
          <button class="${f.source === 'copy' ? 'on' : ''}" onclick="setForm('source','copy')" ${cur ? '' : 'disabled'} title="${cur ? '复制当前选中的 ' + escHtml(cur) : '先在左侧选中一份稿'}">复制当前稿</button>
        </div>
      </div>
      <div class="sheet-actions">
        <button class="btn" onclick="closeSheet()">取消</button>
        <button class="btn primary" onclick="submitNewDraft()" ${!fileName || bad || f.busy ? 'disabled' : ''}>${f.busy ? '正在建…' : '新建'}</button>
      </div>`;
  }

  if (state.sheet === 'newProject') {
    // UI-7：两步不变（选目录 → 名称 / 标题），但换成面板：能校验、能提示「这个目录里已有 N 份稿」
    const name = (f.name || '').trim();
    const nameBad = name && !/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(name);
    const info = f.info;
    let notice = '';
    if (info && info.isProject) {
      notice = `<div class="notice"><span class="grow">这个目录已经是一个项目（有 project.json）。</span><button class="btn sm" onclick="handleOpenPath('${escHtml(f.dir)}')">直接打开</button></div>`;
    } else if (info && info.draftCount > 0) {
      notice = `<div class="notice"><span class="grow">这个目录里已有 ${info.draftCount} 份稿。新建会把它们接管进项目，稿件不动，只加 project.json。</span></div>`;
    }
    body = `
      <h2>新建项目</h2>
      <p class="sub">项目就是磁盘上一个目录。选一个目录，它本身成为项目根；里面已有的稿件会被接管，不会被改动。</p>
      <div class="field">
        <label>目录</label>
        <div class="row">
          <input type="text" value="${escHtml(f.dir || '')}" placeholder="/Users/…/我的项目" oninput="setForm('dir', this.value)" onchange="inspectDir()" />
          <button class="btn" onclick="pickDir()">${ICON.folder} 选择</button>
        </div>
        <div class="field-note">${info && info.exists === false ? '<span style="color:var(--warn)">目录还不存在，会自动创建</span>' : ''}</div>
      </div>
      ${notice}
      <div class="field">
        <label>项目名</label>
        <input type="text" class="${nameBad ? 'invalid' : ''}" value="${escHtml(f.name || '')}" placeholder="英文 / 数字 / - _" oninput="setForm('name', this.value)" />
        <div class="field-note ${nameBad ? 'err' : ''}">${nameBad ? '只能用英文、数字、- 和 _，且以英文或数字开头' : '也是 MCP 里的项目标识'}</div>
      </div>
      <div class="field">
        <label>标题</label>
        <input type="text" value="${escHtml(f.title || '')}" placeholder="给人看的名字，可选" oninput="setForm('title', this.value)" />
      </div>
      <div class="sheet-actions">
        <button class="btn" onclick="closeSheet()">取消</button>
        <button class="btn primary" onclick="submitNewProject()" ${!f.dir || !name || nameBad || (info && info.isProject) || f.busy ? 'disabled' : ''}>${f.busy ? '正在建…' : '新建项目'}</button>
      </div>`;
  }

  const el = document.createElement('div');
  el.className = 'scrim'; el.id = 'sheet'; el.dataset.kind = state.sheet;
  el.innerHTML = `<div class="sheet ${state.sheet === 'settings' && state.project ? 'wide' : ''}" role="dialog" aria-modal="true">${body}</div>`;
  el.addEventListener('mousedown', (e) => { if (e.target === el) closeSheet(); });
  document.body.appendChild(el);
  const first = el.querySelector('input[autofocus]');
  if (first) first.focus();
}

async function pickDir() {
  if (!T) { toast('浏览器调试模式没有目录对话框，直接在框里填路径', 'error'); return; }
  const dir = await T.dialog.open({ title: '选择项目目录', directory: true });
  if (!dir) return;
  state.form.dir = dir;
  if (!state.form.name) state.form.name = baseName(dir).replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '');
  renderSheet();
  inspectDir();
}

async function inspectDir() {
  const dir = (state.form.dir || '').trim();
  if (!dir || !T) return;
  try {
    const r = await mcp('inspect_dir', { dir });
    if (r?.ok) {
      state.form.info = r.data;
      if (!state.form.name && r.data.suggestedName) state.form.name = r.data.suggestedName;
      renderSheet();
    }
  } catch (e) { /* 探查失败不阻塞新建 */ }
}

async function submitNewProject() {
  const f = state.form;
  f.busy = true; renderSheet();
  try {
    const result = parseMcpResult(await invoke('create_project_command', { name: f.name.trim(), dir: f.dir.trim(), title: f.title.trim() || undefined }));
    if (result?.ok && result.data) {
      toast('项目创建成功: ' + (result.data.name || f.name), 'success');
      state.sheet = null;
      await openProjectDir(result.data.dir || f.dir.trim());
    } else {
      throw new Error(result?.errors?.[0]?.message || '未知错误');
    }
  } catch (e) {
    toast('创建项目失败: ' + e.message, 'error');
    f.busy = false; renderSheet();
  }
}

async function submitNewDraft() {
  const f = state.form;
  const name = f.name.trim();
  const path = name.endsWith('.dc.html') ? name : name + '.dc.html';
  f.busy = true; renderSheet();
  try {
    const args = { project: projectRef(), path, source: f.source };
    if (f.source === 'blank') args.title = f.title.trim() || undefined;
    if (f.source === 'copy') args.sourceFile = state.selectedDraft;
    const r = await mcp('create_draft', args);
    if (!r?.ok) throw new Error(r?.errors?.[0]?.message || '未知错误');
    toast('已新建 ' + path, 'success');
    state.sheet = null;
    await fetchDrafts();
    selectDraft(path);
  } catch (e) {
    toast('新建稿件失败: ' + e.message, 'error');
    f.busy = false; renderSheet();
  }
}

// ── 过滤 ──────────────────────────────────────────────
function filterDrafts() {
  const q = state.search.trim().toLowerCase();
  return state.drafts.filter(d => {
    if (state.filter === 'page' && d.kind === 'component') return false;
    if (state.filter === 'component' && d.kind !== 'component') return false;
    if (state.filter === 'error' && !(d.diagnostics && d.diagnostics.errors > 0) && d.health !== 'error') return false;
    if (state.filter === 'warn' && !(d.diagnostics && d.diagnostics.warnings > 0) && d.health !== 'warn') return false;
    if (state.filter === 'unchecked' && d.health !== 'unchecked') return false;
    if (q) {
      const hay = [d.title, d.file, (d.states || []).join(' ')].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

// ── 事件处理 ──────────────────────────────────────────
function onSearch(v) { state.search = v; render(); }
/* M5-6 键盘：列表里 ↑↓ 移动焦点、Enter / 空格选中、Home / End 到头尾；全局 / 聚焦搜索，Cmd/Ctrl+J 聚焦会话输入 */
function draftKey(e, file) {
  const items = Array.from(document.querySelectorAll('.draft-item'));
  const i = items.indexOf(e.currentTarget);
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectDraft(file); return; }
  let j = null;
  if (e.key === 'ArrowDown') j = Math.min(items.length - 1, i + 1);
  if (e.key === 'ArrowUp') j = Math.max(0, i - 1);
  if (e.key === 'Home') j = 0;
  if (e.key === 'End') j = items.length - 1;
  if (j !== null) { e.preventDefault(); items[j].focus(); }
}
document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || state.sheet;
  if (e.key === '/' && !typing) { const s = document.querySelector('.sidebar-search input'); if (s) { e.preventDefault(); s.focus(); } }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'j' && state.project) { e.preventDefault(); if (!state.chat.open) toggleChatRail(); const t = document.getElementById('chatInput'); if (t) t.focus(); }
});
function setFilter(f) { state.filter = f; render(); }
function setBottomTab(t) {
  state.bottomTab = t;
  if (state.bottomMode === 'collapsed') state.bottomMode = 'normal';
  render();
  if (t === 'changes' && state.selectedDraft) fetchChanges(state.selectedDraft);
}

function selectDraft(file) {
  state.selectedDraft = file;
  state.diags = []; state.changes = [];
  render();
  fetchDiagnostics(file);
  if (state.bottomTab === 'changes') fetchChanges(file);
}

// ── API 调用 ──────────────────────────────────────────
function apiUrl(path) {
  const basePath = state.project.url.replace(/\/$/, '') + '/__ud/' + path;
  return basePath + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(state.project.token);
}

async function apiFetch(path, init) {
  const r = await fetch(apiUrl(path), init);
  if (!r.ok && r.status !== 400) throw new Error(`API ${r.status}: ${r.statusText}`);
  return r.json();
}

async function fetchDrafts() {
  try {
    const res = await apiFetch('drafts');
    if (res.ok && res.data) {
      // drafts 路由把 build_index 算好的类型 / 健康 / 元素数 / 版本一起给了（没建过索引就只有文件名）
      const prev = new Map(state.drafts.map(d => [d.file, d]));
      state.drafts = (res.data.drafts || (res.data.files || []).map(f => ({ file: f }))).map(d => ({
        file: d.file,
        title: d.title || baseName(d.file).replace(/\.dc\.html$/, ''),
        kind: d.kind || 'page',
        health: d.health || 'unchecked',
        healthWhy: d.healthWhy || (res.data.indexed ? '' : '还没建过索引'),
        diagnostics: d.diagnostics || { errors: 0, warnings: 0 },
        elements: d.elements || (prev.get(d.file) || {}).elements || null,
        version: d.version || (prev.get(d.file) || {}).version || null,
        updatedAt: d.updatedAt || null,
        states: d.states || [],
        imports: d.imports || [],
        importedBy: d.importedBy || [],
      }));
      render();
    }
  } catch (e) {
    toast('获取稿件列表失败: ' + e.message, 'error');
  }
}

async function fetchDiagnostics(file) {
  try {
    const res = await apiFetch('validate?file=' + encodeURIComponent(file));
    if (res.data) {
      state.diags = res.data.diags || [];
      const s = res.data.stats || {};
      const draft = state.drafts.find(d => d.file === file);
      if (draft && s.elements) draft.elements = s.elements;
      if (draft && s.kind) draft.kind = s.kind;
      if (draft && res.data.workspace) draft.version = res.data.workspace.version || draft.version;
      // 健康（UI-3 四色）按 indexpage.judgeHealth 的口径就地重算：侧栏的缓存只在 build_index 时刷新，
      // 刚跑完体检不能还挂着「未体检」。宁可说不知道，不可以说通过 —— 体检读数过期就当没体检
      if (draft) {
        const errors = state.diags.filter(d => d.level === 'error').length;
        const warnings = state.diags.filter(d => d.level === 'warning').length;
        const chk = res.data.checkStale ? null : res.data.check;
        if (errors) { draft.health = 'error'; draft.healthWhy = errors + ' 条 error 级诊断，落盘会被拒'; }
        else if (chk && !chk.alive) { draft.health = 'error'; draft.healthWhy = '体检时页面没画出来'; }
        else if (!chk) { draft.health = 'unchecked'; draft.healthWhy = res.data.check ? '稿改过之后没再体检，旧读数不算数' : '还没跑过 render_check'; }
        else if (warnings || (chk.counts && (chk.counts.unresolvedHoles || chk.counts.externalRequests || chk.counts.missingResources))) { draft.health = 'warn'; draft.healthWhy = warnings ? warnings + ' 条 warning' : '体检有提醒（洞 / 外部请求 / 404）'; }
        else { draft.health = 'ok'; draft.healthWhy = '静态校验干净，体检 ' + chk.nodeCount + ' 节点 · ' + chk.renderMs + ' ms'; }
        draft.diagnostics = { errors, warnings };
      }
      render();
    }
  } catch (e) {
    toast('获取诊断失败: ' + e.message, 'error');
  }
}

async function fetchChanges(file) {
  try {
    const res = await apiFetch('changes?file=' + encodeURIComponent(file));
    state.changes = (res.ok && res.data && res.data.diff) ? (res.data.diff.changes || []).map(c => ({
      level: c.level, at: c.at, message: c.message || `${c.target || ''} ${c.kind || ''}`.trim(),
    })) : [];
    render();
  } catch (e) {
    toast('获取变更失败: ' + e.message, 'error');
  }
}

// ── 操作 ──────────────────────────────────────────────
async function handleOpenProject() {
  if (!T) { toast('浏览器调试模式请用 ?url=&token= 打开', 'error'); return; }
  try {
    const selected = await T.dialog.open({ title: '选择项目目录', directory: true });
    if (!selected) return;
    await openProjectDir(selected);
  } catch (e) {
    /* openProjectDir 自己已 toast；这里只兜对话框的错 */
    if (!/打开项目失败/.test(String(e && e.message))) toast('打开项目失败: ' + e.message, 'error');
  }
}

async function handleOpenPath(path) { state.sheet = null; try { await openProjectDir(path); } catch (_) { /* 已 toast */ } }

async function openProjectDir(dir) {
  try {
    if (T) { const st = await invoke('get_sidecar_status').catch(() => ({})); if (st.status !== 'running') { try { await invoke('start_sidecar'); } catch (e) { throw new Error('sidecar 没起来：' + (e.message || e)); } } }
    const serve = parseMcpResult(await invoke('open_project_command', { dir }));
    if (!serve?.ok) throw new Error(serve?.errors?.[0]?.message || '未知错误');
    if (!serve.data?.url) throw new Error('serve_start 未返回 URL');
    const info = serve.data;
    state.project = { name: info.project || baseName(dir), title: info.title || '', dir, url: info.url, token: info.token };
    state.selectedDraft = null; state.diags = []; state.changes = [];
    await fetchDrafts();
    render();
    chatLoad();
  } catch (e) {
    toast('打开项目失败: ' + e.message, 'error');
    throw e;   // 调用方（自测、新建项目）要拿到原因
  }
}

async function handleCloseProject() {
  if (state.project && T) {
    try { parseMcpResult(await invoke('close_project_command', { name: state.project.name })); } catch (_) { /* ignore */ }
  }
  state.project = null; state.drafts = []; state.selectedDraft = null; state.diags = []; state.changes = [];
  render();
}

async function handleBuildIndex() {
  if (!state.project) return;
  toast('正在重建索引…', 'success');
  try {
    // 本地 API 的 rebuild_index 和 MCP 的 build_index 是同一个函数；浏览器调试模式只有前者
    const res = T
      ? await mcp('build_index', { project: projectRef() })
      : await apiFetch('rebuild_index', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    if (res?.ok) { toast('索引重建完成', 'success'); await fetchDrafts(); }
    else toast('索引重建失败: ' + (res?.errors?.[0]?.message || '未知错误'), 'error');
  } catch (e) {
    toast('索引重建失败: ' + e.message, 'error');
  }
}

async function handleValidate() {
  if (!state.selectedDraft || !state.project) return;
  const file = state.selectedDraft;
  state.validating = true; state.checkingFile = file;   // UI-3：行上转圈，健康色压到 55%
  render();
  try {
    // 作业接口（doc/00 §二十三）：POST 起 → { jobId, running }；GET check_status?job= 轮询 → running=false 时看 ok / error
    const res = await apiFetch('check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file }) });
    if (res.ok && res.data && res.data.jobId) await pollJob(res.data.jobId);
    else throw new Error(res?.errors?.[0]?.message || '起作业失败');
  } catch (e) {
    toast('体检失败: ' + e.message, 'error');
  } finally {
    state.validating = false; state.checkingFile = null;
    await fetchDrafts();
    if (state.selectedDraft) fetchDiagnostics(state.selectedDraft);
  }
}

async function pollJob(jobId) {
  for (let i = 0; i < 60; i++) {
    await sleep(1000);
    try {
      const res = await apiFetch('check_status?job=' + encodeURIComponent(jobId));
      const j = res && res.data;
      if (j && j.running === false) {
        if (j.error) { toast('体检出错: ' + (j.error.message || j.error), 'error'); return; }
        const r = (j.result && j.result.result) || {};   // 作业存的是 { file, result: RenderResult, diags }
        toast(r.alive === false ? '体检完成：页面没画出来（1+1 都算不出）' : '体检完成：' + (r.nodeCount ?? '?') + ' 节点 · ' + (r.renderMs ?? '?') + ' ms', r.alive === false ? 'error' : 'success');
        return;
      }
    } catch (_) { /* keep polling */ }
  }
  toast('体检超时（>2 分钟）', 'error');
}

function openExternal(url, label) {
  // UI-4：S6 是独立整页。应用里开一个新窗口；开不了（没权限 / 浏览器模式）就交给系统浏览器
  if (T && T.webviewWindow && T.webviewWindow.WebviewWindow) {
    try {
      const w = new T.webviewWindow.WebviewWindow(label || ('w' + Date.now()), { url, title: 'UmbraDesign · 版本对比', width: 1280, height: 800 });
      w.once('tauri://error', () => { if (T.shell) T.shell.open(url); });
      return;
    } catch (e) { /* 走下面 */ }
  }
  if (T && T.shell) T.shell.open(url); else window.open(url, '_blank');
}

function handleOpenInBrowser() {
  if (!state.project || !state.selectedDraft) return;
  const url = state.project.url + encodeURIComponent(state.selectedDraft).replace(/%2F/g, '/');
  if (T && T.shell) T.shell.open(url); else window.open(url, '_blank');
}

function handleCompare() {
  if (!state.project || !state.selectedDraft) return;
  const url = state.project.url + encodeURIComponent('S6-版本对比.dc.html') + '?file=' + encodeURIComponent(state.selectedDraft);
  openExternal(url, 'compare');
}

// ── 工具函数 ──────────────────────────────────────────
function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function baseName(p) { return p ? p.split('/').pop().split('\\').pop() : ''; }
function timeAgo(iso) {
  if (!iso) return '—';
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function toast(msg, type) {
  const el = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  el.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

// ── 启动 ──────────────────────────────────────────────
async function boot() {
  applyTheme();
  // 浏览器调试模式：?url=http://127.0.0.1:port/&token=…&name=… —— 只靠本地 API，不经 Tauri
  const q = new URLSearchParams(location.search);
  if (!T && q.get('url') && q.get('token')) {
    state.project = { name: q.get('name') || 'project', title: q.get('title') || '', dir: q.get('dir') || '', url: q.get('url'), token: q.get('token') };
    state.sidecar = 'running';
    render();
    await fetchDrafts();
    chatLoad();
    return;
  }
  try {
    const status = await invoke('get_sidecar_status');
    state.sidecar = status.status === 'running' ? 'running' : 'stopped';
  } catch (_) {
    state.sidecar = 'stopped';
  }
  render();
  autotest();
}

/* ── 壳内自测（doc/00 §三十八）。只在 Tauri 里、且设了 UMBRADESIGN_AUTOTEST_DIR 时跑：
   打开项目 → 选第一份稿 → 体检（POST，验 Origin 放行）→ 变更 → 会话列表 → 重建索引 → S6 新窗口，
   每步一行 JSON 写进 UMBRADESIGN_AUTOTEST_LOG。它只读、只建索引，不改稿。 */
async function autotest() {
  if (!T) return;
  let cfg = null;
  try { cfg = await invoke('get_autotest'); } catch (_) { return; }
  if (!cfg || !cfg.dir) return;
  const log = async (step, ok, extra) => { try { await invoke('autotest_log', { line: JSON.stringify({ t: new Date().toISOString(), step, ok, ...(extra || {}) }) }); } catch (_) { /* ignore */ } };
  const tryStep = async (step, fn) => { try { const r = await fn(); await log(step, true, r); return r; } catch (e) { await log(step, false, { error: String(e && e.message || e) }); return null; } };
  await log('start', true, { dir: cfg.dir, origin: location.origin });
  await tryStep('sidecar', async () => { const st = await invoke('get_sidecar_status'); return st; });
  await tryStep('open_project', async () => { await openProjectDir(cfg.dir); if (!state.project) throw new Error('state.project 为空'); return { url: state.project.url, drafts: state.drafts.length }; });
  if (!state.project) { await log('done', false); return; }
  const first = state.drafts[0] && state.drafts[0].file;
  await tryStep('select_draft', async () => { if (!first) throw new Error('没有稿'); selectDraft(first); await sleep(1500); return { file: first, previewSrc: previewSrc().replace(state.project.url, '/') }; });
  await tryStep('validate_get', async () => { const r = await apiFetch('validate?file=' + encodeURIComponent(first)); return { ok: r.ok, diags: (r.data && r.data.diags || []).length }; });
  await tryStep('check_post', async () => { const r = await apiFetch('check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: first }) }); if (!r.ok) throw new Error(JSON.stringify(r.errors)); return { jobId: r.data && r.data.jobId }; });
  await tryStep('changes_get', async () => { const r = await apiFetch('changes?file=' + encodeURIComponent(first)); return { versions: (r.data && r.data.versions || []).length, versionMeta: Object.keys(r.data && r.data.versionMeta || {}).length }; });
  await tryStep('chat_list', async () => { const r = await apiFetch('chat_list'); return { sessions: (r.data && r.data.sessions || []).length }; });
  await tryStep('rebuild_index_mcp', async () => { const r = await mcp('build_index', { project: projectRef() }); if (!r || !r.ok) throw new Error(JSON.stringify(r && r.errors)); return { drafts: r.data && r.data.drafts }; });
  await tryStep('inspect_dir_mcp', async () => { const r = await mcp('inspect_dir', { dir: cfg.dir }); if (!r || !r.ok) throw new Error(JSON.stringify(r && r.errors)); return r.data; });
  await tryStep('s6_window', async () => { handleCompare(); await sleep(2500); return { opened: true }; });
  await tryStep('theme', async () => { setTheme('dark'); const t = document.documentElement.getAttribute('data-tool-theme'); setTheme('system'); return { applied: t }; });
  await log('done', true);
}

boot();
</script>
